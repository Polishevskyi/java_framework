name: All Tests (API + Web + Mobile)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform for mobile tests'
        required: false
        default: 'android'
        type: choice
        options:
          - android
          - ios

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-format:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Check code formatting
        run: mvn spotless:check -q

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create config.properties file
        run: |
          cat > config.properties << EOF
          # API Configuration
          api.baseUrl=${{ secrets.API_BASE_URL }}
          api.credentials.username=${{ secrets.API_CREDENTIALS_USERNAME }}
          api.credentials.password=${{ secrets.API_CREDENTIALS_PASSWORD }}
          EOF

      - name: Run API tests
        run: mvn clean test -Papi -q

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-api
          path: target/allure-results/
          retention-days: 30

  web-tests:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create config.properties file
        run: |
          cat > config.properties << EOF
          # Web Configuration
          web.baseUrl=${{ secrets.WEB_BASE_URL }}
          web.browser=${{ secrets.WEB_BROWSER }}
          web.browserSize=${{ secrets.WEB_BROWSER_SIZE }}
          web.headless=${{ secrets.WEB_HEADLESS }}
          web.credentials.username=${{ secrets.WEB_USERNAME }}
          web.credentials.password=${{ secrets.WEB_PASSWORD }}
          EOF

      - name: Run Web tests
        run: mvn clean test -Pweb -q

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-web
          path: target/allure-results/
          retention-days: 30

  mobile-tests:
    name: Mobile Tests on BrowserStack
    runs-on: ubuntu-latest
    needs: lint-and-format
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Create config.properties file
        run: |
          PLATFORM_VALUE="${{ github.event.inputs.platform }}"
          if [ -z "$PLATFORM_VALUE" ]; then
            PLATFORM_VALUE="${{ secrets.MOBILE_PLATFORM }}"
          fi
          cat > config.properties << EOF
          # App Configuration
          mobile.platform=${PLATFORM_VALUE}
          mobile.isCloud=${{ secrets.MOBILE_IS_CLOUD }}

          # Test Data
          mobile.credentials.username=${{ secrets.MOBILE_USERNAME }}
          mobile.credentials.password=${{ secrets.MOBILE_PASSWORD }}

          # BrowserStack Configuration
          browserstack.username=${{ secrets.BROWSERSTACK_USERNAME }}
          browserstack.accessKey=${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          browserstack.appiumVersion=${{ secrets.BROWSERSTACK_APPIUM_VERSION }}
          browserstack.hubUrl=${{ secrets.BROWSERSTACK_HUB_URL }}

          # Android Cloud Configuration
          android.cloud.deviceName=${{ secrets.ANDROID_DEVICE_NAME }}
          android.cloud.platformVersion=${{ secrets.ANDROID_PLATFORM_VERSION }}
          android.cloud.appPackage=${{ secrets.ANDROID_APP_PACKAGE }}
          android.cloud.appActivity=${{ secrets.ANDROID_APP_ACTIVITY }}
          browserstack.android.app=${{ secrets.BROWSERSTACK_ANDROID_APP_ID }}

          # iOS Cloud Configuration
          ios.cloud.deviceName=${{ secrets.IOS_DEVICE_NAME }}
          ios.cloud.platformVersion=${{ secrets.IOS_PLATFORM_VERSION }}
          ios.cloud.bundleId=${{ secrets.IOS_BUNDLE_ID }}
          browserstack.ios.app=${{ secrets.BROWSERSTACK_IOS_APP_ID }}
          EOF

      - name: Run Mobile tests
        run: mvn clean test -Pmobile -q

      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-mobile
          path: target/allure-results/
          retention-days: 30

  allure-report:
    name: Generate Allure Report
    runs-on: ubuntu-latest
    needs: [ api-tests, web-tests, mobile-tests ]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Allure Results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Load test report history
        uses: actions/checkout@v6
        if: always()
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure Report
        uses: simple-elf/allure-report-action@master
        if: always()
        with:
          gh_pages: gh-pages
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to Github Pages
        if: always()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          folder: allure-history
          clean: false

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Send Telegram notification
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_EVENT_REPOSITORY_NAME: ${{ github.event.repository.name }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          chmod +x send-telegram-notification.sh
          ./send-telegram-notification.sh
